# 边缘交付形态：限制资源、只读根、总是重启。
# 用法：docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.edge.yaml up -d
# 现场换成 Podman 时，本文件语义由 deploy/podman/quadlet/ 的 .container 承接。
services:
  mqtt:
    read_only: false
    deploy: { resources: { limits: { cpus: "0.5", memory: 128M } } }
  db:
    deploy: { resources: { limits: { cpus: "1.0", memory: 1G } } }
  ingest:
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }
    read_only: true
    tmpfs: ["/tmp"]
  api:
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }
  web:
    deploy: { resources: { limits: { cpus: "0.2", memory: 64M } } }
