# 基础编排：边缘单机五件套。端口全部走 .env，避开宿主已占的 1883/5432/8000。
# 路径相对本文件：../../code/* 即仓库根的 code/*。
name: ${COMPOSE_PROJECT_NAME:-interroll-poc}

# 边缘机磁盘小：日志必须有上限，否则跑几个月把盘写满
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mqtt:
    logging: *default-logging
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1884}:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -p 1883 -t '$$SYS/#' -C 1 -W 2 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    logging: *default-logging
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-poc}
      POSTGRES_USER: ${DB_USER:-poc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD（make env 可生成）}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-poc} -d ${DB_NAME:-poc}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingest:
    logging: *default-logging
    # 镜像由 podman 构建后导入（见 deploy/scripts/build-images.sh），compose 只负责运行
    image: interroll-poc-ingest:${APP_VERSION:-0.3.1}
    pull_policy: never   # 本地镜像，别去远端找
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      DB_DSN: postgresql://${DB_USER:-poc}:${DB_PASSWORD}@db:5432/${DB_NAME:-poc}
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_started }

  api:
    logging: *default-logging
    # 镜像由 podman 构建后导入（见 deploy/scripts/build-images.sh），compose 只负责运行
    image: interroll-poc-api:${APP_VERSION:-0.3.1}
    pull_policy: never   # 本地镜像，别去远端找
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-0.3.1}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      DB_DSN: postgresql://${DB_USER:-poc}:${DB_PASSWORD}@db:5432/${DB_NAME:-poc}
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      db: { condition: service_healthy }

  web:
    logging: *default-logging
    # 镜像由 podman 构建后导入（见 deploy/scripts/build-images.sh），compose 只负责运行
    image: interroll-poc-web:${APP_VERSION:-0.3.1}
    pull_policy: never   # 本地镜像，别去远端找
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5174}:80"
    depends_on:
      - api

  # 只在开发/演示时开：docker compose --profile demo up -d simulator
  simulator:
    logging: *default-logging
    # 镜像由 podman 构建后导入（见 deploy/scripts/build-images.sh），compose 只负责运行
    image: interroll-poc-simulator:${APP_VERSION:-0.3.1}
    pull_policy: never   # 本地镜像，别去远端找
    profiles: ["demo"]
    environment:
      MQTT_HOST: mqtt
      SAMPLE_HZ: ${SAMPLE_HZ:-10}
      ZONES: ${ZONES:-6}
      DRIVES_PER_ZONE: ${DRIVES_PER_ZONE:-6}
    depends_on:
      mqtt: { condition: service_started }

# 宿主机的默认地址池（172.17–172.31）已被 33 个网络用满，这里显式指定网段，
# 否则 compose 起栈会报 "all predefined address pools have been fully subnetted"。
networks:
  default:
    ipam:
      config:
        - subnet: 10.77.31.0/24

volumes:
  pgdata:
